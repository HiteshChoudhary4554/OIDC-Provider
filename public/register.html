<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f7fb" />
  <title>Create account</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      padding: 24px;
      background: #f4f7fb;
      color: #202938;
      font: 15px/1.5 system-ui, sans-serif;
    }

    .register-card {
      width: min(100%, 420px);
      padding: 40px;
      border: 1px solid #e3e8ef;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 12px 36px #172b4d12;
    }

    h1 {
      margin: 0;
      font-size: 1.75rem;
      letter-spacing: -0.03em;
    }

    .intro {
      margin: 8px 0 28px;
      color: #667085;
    }

    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      color: inherit;
      font: inherit;
    }

    input:focus-visible {
      border-color: #3974e8;
      outline: 3px solid #3974e833;
    }

    button {
      width: 100%;
      min-height: 46px;
      margin-top: 26px;
      border: 0;
      border-radius: 8px;
      background: #245fdb;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #194db9;
    }

    button:focus-visible {
      outline: 3px solid #3974e866;
      outline-offset: 3px;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    #message {
      margin: 18px 0 0;
    }

    #message:empty {
      display: none;
    }

    #message[data-state="error"] {
      color: #b42318;
    }

    #message[data-state="success"] {
      color: #067647;
    }

    @media (max-width: 480px) {
      .register-card {
        padding: 30px 24px;
      }
    }
  </style>
</head>
<body>
  <main class="register-card">
    <h1>Create your account</h1>
    <p class="intro">Enter your details to register.</p>

    <form id="register-form">
      <label for="firstName">First name</label>
      <input
        id="firstName"
        name="firstName"
        type="text"
        autocomplete="given-name"
        minlength="8"
        maxlength="15"
        required
      />

      <label for="lastName">Last name</label>
      <input
        id="lastName"
        name="lastName"
        type="text"
        autocomplete="family-name"
      />

      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        placeholder="you@example.com"
        required
      />

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="new-password"
        minlength="6"
        required
      />

      <button type="submit" id="submit">Create account</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const form = document.getElementById("register-form");
    const submitButton = document.getElementById("submit");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";
      message.removeAttribute("data-state");
      submitButton.disabled = true;

      const formData = new FormData(form);
      const payload = {
        firstName: formData.get("firstName").trim(),
        lastName: formData.get("lastName").trim() || null,
        email: formData.get("email").trim(),
        password: formData.get("password")
      };

      try {
        const response = await fetch("/auth/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.message || result.error || "Registration failed.");
        }

        message.dataset.state = "success";
        message.textContent = result.message || "Account created successfully.";
        form.reset();
      } catch (error) {
        message.dataset.state = "error";
        message.textContent = error instanceof Error
          ? error.message
          : "Unable to register. Please try again.";
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
